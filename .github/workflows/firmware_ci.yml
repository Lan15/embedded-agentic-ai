name: Firmware CI
on:
  pull_request:
    branches: [main]

jobs:
  static-analysis:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get install -y clang-tidy cppcheck
      - name: clang-tidy
        run: |
          clang-tidy src/**/*.c -- -std=c11 -Iinclude \
            --checks="-*,clang-analyzer-*,cert-*" \
            --warnings-as-errors="*"
      - name: cppcheck
        run: cppcheck --enable=all --std=c11 --error-exitcode=1 src/

  unit-tests:
    runs-on: self-hosted
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -B build -G Ninja -DENABLE_TESTS=ON
          cmake --build build --parallel 4
          cd build && ctest --output-on-failure -V
