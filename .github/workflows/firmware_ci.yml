name: Firmware CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  static-analysis:
    runs-on: [self-hosted, jetson, arm64]
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install tools
        run: sudo apt-get install -y clang-tidy cppcheck
      - name: Check codegen output
        run: |
          if [ -d "codegen_output" ]; then
            echo "Found codegen output"
            ls codegen_output/
          else
            echo "No codegen output yet — skipping"
          fi

  unit-tests:
    runs-on: [self-hosted, jetson, arm64]
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install cmake ninja
        run: sudo apt-get install -y cmake ninja-build gcc
      - name: Build and test
        run: |
          cmake -B build -G Ninja -DENABLE_TESTS=ON
          cmake --build build --parallel 4
          cd build && ctest --output-on-failure -V
